name: greenprint-livv-clients-discover
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium (isolated)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Map Livv client pages
        env:
          LIVV_EMAIL: ${{ secrets.LIVV_EMAIL }}
          LIVV_PASSWORD: ${{ secrets.LIVV_PASSWORD }}
          GP_ADMIN_KEY: ${{ secrets.GP_ADMIN_KEY }}
        run: |
          cp "$GITHUB_WORKSPACE/scripts/livv-clients-discover.mjs" /tmp/pw/d.mjs
          cd /tmp/pw && node d.mjs
