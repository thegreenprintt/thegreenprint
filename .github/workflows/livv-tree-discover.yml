name: greenprint-livv-tree-discover
on:
  workflow_dispatch:
    inputs:
      check:
        description: "name=amount (e.g. devin=2200)"
        required: false
jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium (isolated)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Probe Tree Chart
        env:
          LIVV_EMAIL: ${{ secrets.LIVV_EMAIL }}
          LIVV_PASSWORD: ${{ secrets.LIVV_PASSWORD }}
          CHECK: ${{ inputs.check }}
        run: |
          cp "$GITHUB_WORKSPACE/scripts/livv-tree-discover.mjs" /tmp/pw/t.mjs
          cd /tmp/pw && node t.mjs
