name: greenprint-onehouse-verify
# One-off: confirm which One House field equals the expected lifetime-earnings
# value. The value is passed at dispatch time (never committed). Read-only probe;
# the response reports only a match boolean + field name, never the amount.
on:
  workflow_dispatch:
    inputs:
      expect:
        description: "Expected lifetime earnings (whole dollars)"
        required: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify earnings field
        run: |
          echo "Match check (no amounts):"
          curl -s -m 150 "https://thegreenprint.trade/api/chat?kind=1h-refresh&key=gp1h-cron-pull-v1&debug=1&discover=1&expect=${{ inputs.expect }}" | head -c 8000 || true
          echo
